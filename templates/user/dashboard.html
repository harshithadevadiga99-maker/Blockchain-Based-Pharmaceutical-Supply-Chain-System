{% extends "base.html" %}
{% block title %}User Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user me-2 text-danger"></i>Welcome, {{ current_user.username }}</h2>
    <a href="{{ url_for('chatbot') }}" class="btn gradient-btn">
        <i class="fas fa-robot me-2"></i>AI Assistant
    </a>
</div>

<div class="alert alert-info">

</div> -->

<!-- SEARCH SECTION -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fas fa-search me-2"></i>Search Medicine & Track Supply Chain</h5>
    </div>
    <div class="card-body">
        <form method="GET" action="{{ url_for('user_search') }}" class="row g-2">
            <div class="col-md-5">
                <label class="form-label">Medicine Name</label>
                <input type="text" name="q" class="form-control" placeholder="e.g., Paracetamol" value="{{ request.args.get('q', '') }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Pharmacy (optional)</label>
                <select name="pharmacy" class="form-select">
                    <option value="">All Pharmacies</option>
                    {% for p in pharmacies %}
                        <option value="{{ p.id }}" {% if request.args.get('pharmacy') == p.id|string %}selected{% endif %}>
                            {{ p.company_name or p.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn gradient-btn w-100">
                    <i class="fas fa-search me-1"></i>Track
                </button>
            </div>
        </form>
    </div>
</div>
